[workspace]
resolver = "2"
members = [
  "examples/rust",

  "cala-ledger",
  "cala-ledger-core-types",
  "cala-cel-interpreter",
  "cala-perf",
]

[workspace.dependencies]
cel-interpreter = { path = "cala-cel-interpreter", package = "cala-cel-interpreter", version = "0.31.1-dev" }
cala-types = { path = "cala-ledger-core-types", package = "cala-ledger-core-types", version = "0.31.1-dev" }
cala-ledger = { path = "cala-ledger", version = "0.31.1-dev" }

cel = "0.14.5"
es-entity = "=0.14.4-dev"
errlanes = { version = "=0.14.4-dev", features = ["derive", "sqlx"] }
job = { version = "=0.16.2-dev", features = ["es-entity"] }
obix = { version = "=0.13.2-dev", default-features = false }

anyhow = "1.0.99"
cached = { version = "4.0", features = ["async"] }
chrono = { version = "0.4.44", features = ["clock", "serde"], default-features = false }
derive_builder = "0.20.1"
sqlx = { version = "0.8.3", features = [ "runtime-tokio-rustls", "postgres", "rust_decimal", "uuid", "chrono", "json" ] }
thiserror = "2.0.18"
uuid = { version = "1.23", features = ["serde", "v7"] }
regex = "1.11.2"
tracing = "0.1.41"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
futures = "0.3.29"
rust_decimal_macros = "1.39"
rust_decimal = "1.42"
rusty-money = { version = "0.5", features = ["iso", "crypto"] }
schemars = { version = "1.0", features = ["uuid1"] }
rand = "0.10"

[profile.release]
lto = true

[profile.bench]
debug = true

# Temporary v2 validation pins; replace together after compatible releases.
[patch.crates-io]
es-entity = { git = "https://github.com/GaloyMoney/es-entity", rev = "a5f224b1c56b56b6374f214cddb791b6aea99a87" }
es-entity-macros = { git = "https://github.com/GaloyMoney/es-entity", rev = "a5f224b1c56b56b6374f214cddb791b6aea99a87" }
errlanes = { git = "https://github.com/GaloyMoney/es-entity", rev = "a5f224b1c56b56b6374f214cddb791b6aea99a87" }
errlanes-derive = { git = "https://github.com/GaloyMoney/es-entity", rev = "a5f224b1c56b56b6374f214cddb791b6aea99a87" }
job = { git = "https://github.com/GaloyMoney/job", rev = "30f96bc6e15efae4d1e779bca24fdcc0319b808c" }
obix = { git = "https://github.com/GaloyMoney/obix", rev = "a7442a8fe752f937cd846b34c628142179694434" }
