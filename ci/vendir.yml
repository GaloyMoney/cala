apiVersion: vendir.k14s.io/v1alpha1
kind: Config

# Relative to ci/
directories:
- path: ../.github/workflows/vendor
  contents:
  - path: . # Copy this folder out to ..
    git:
      url: https://github.com/GaloyMoney/galoy-concourse-shared.git
      ref: cc91f0f689917e4f612bb00bd350388f0df1ddc1
    includePaths:
    - shared/actions/*
    excludePaths:
    - shared/actions/nodejs-*
    - shared/actions/docker-*
    - shared/actions/chart-*
    newRootPath: shared/actions

- path: ./vendor
  contents:
  - path: .
    git:
      url: https://github.com/GaloyMoney/galoy-concourse-shared.git
      ref: cc91f0f689917e4f612bb00bd350388f0df1ddc1
    includePaths:
    - shared/ci/**/*
    excludePaths:
    - shared/ci/**/nodejs-*
    - shared/ci/**/chart-*
    - shared/ci/**/docker-*
    newRootPath: shared/ci
