[package]
name = "cala-fuzz"
version = "0.31.1-dev"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false }
rust_decimal = "1"
serde_json = "1.0"
uuid = { version = "1", features = ["v7"] }

[dependencies.cel-interpreter]
path = "../cala-cel-interpreter"
package = "cala-cel-interpreter"

[dependencies.cala-types]
path = "../cala-ledger-core-types"
package = "cala-ledger-core-types"

# cala-ledger compiles without a database via the committed SQLx offline
# cache, but requires SQLX_OFFLINE=true in the environment when building.
# The `fuzz` feature exposes `cala_ledger::fuzz` (internal, `#[doc(hidden)]`
# harness entry points) so these targets can drive pub(crate) logic without
# the library making its internals public.
[dependencies.cala-ledger]
path = "../cala-ledger"
features = ["fuzz"]

# Keep this crate out of the main workspace.
[workspace]
members = ["."]

# Fuzz builds run in release mode; make sure panics we care about still
# fire while matching production release behavior (no overflow checks).
[profile.release]
debug-assertions = true
overflow-checks = false

[[bin]]
name = "cel_compile"
path = "fuzz_targets/cel_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cel_evaluate"
path = "fuzz_targets/cel_evaluate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "core_types_json"
path = "fuzz_targets/core_types_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "param_coerce"
path = "fuzz_targets/param_coerce.rs"
test = false
doc = false
bench = false

[[bin]]
name = "balance_math"
path = "fuzz_targets/balance_math.rs"
test = false
doc = false
bench = false

[[bin]]
name = "velocity_enforce"
path = "fuzz_targets/velocity_enforce.rs"
test = false
doc = false
bench = false

[[bin]]
name = "effective_balance"
path = "fuzz_targets/effective_balance.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ec_rollup_batch"
path = "fuzz_targets/ec_rollup_batch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "primitives_parse"
path = "fuzz_targets/primitives_parse.rs"
test = false
doc = false
bench = false

# Match the unpublished upstream revisions used by the parent workspace.
[patch.crates-io]
es-entity = { git = "https://github.com/GaloyMoney/es-entity", rev = "a6b4ffcf1c40d906ea78e030ed04ea40188f79d0" }
es-entity-macros = { git = "https://github.com/GaloyMoney/es-entity", rev = "a6b4ffcf1c40d906ea78e030ed04ea40188f79d0" }
errlanes = { git = "https://github.com/GaloyMoney/es-entity", rev = "a6b4ffcf1c40d906ea78e030ed04ea40188f79d0" }
errlanes-derive = { git = "https://github.com/GaloyMoney/es-entity", rev = "a6b4ffcf1c40d906ea78e030ed04ea40188f79d0" }
job = { git = "https://github.com/GaloyMoney/job", rev = "bfe07b22a18903a6f265de3f3de92ce1d4c91340" }
obix = { git = "https://github.com/GaloyMoney/obix", rev = "4e679ea5def26fa2a602578bb9128b5864d501fe" }
